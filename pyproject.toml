[project]
name = "ha-cololight-local"
version = "1.0.0"
description = "Home Assistant custom integration for LifeSmart Cololight lamps (local UDP)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"

[tool.coverage.run]
source = ["custom_components/cololight_local"]

[tool.ruff]
target-version = "py312"
line-length = 110
