name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install test dependencies
        run: pip install -r requirements_test.txt pytest-cov
      # Every test talks to tests/fake_lamp.py on the loopback interface, never to a real lamp.
      - name: Run tests
        run: python -m pytest -q --cov=custom_components/cololight_local --cov-report=term-missing
